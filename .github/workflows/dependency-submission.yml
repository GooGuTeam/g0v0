name: NuGet Dependency Submission

on:
  push:
  workflow_dispatch:

permissions:
  contents: write # to submit the resolved dependency graph

jobs:
  submit-nuget:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install .NET 10.0.x
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # The generated autosubmission workflow restores arbitrary projects, including mobile
      # projects whose workloads are unavailable on this runner. Use the desktop graph instead.
      - name: Restore desktop dependency graph
        run: dotnet restore osu.Desktop.slnf

      - name: Submit resolved NuGet dependencies
        uses: actions/component-detection-dependency-submission-action@98beaea5a1227f3db476e4c9ca959a0cacd7ac4f
        with:
          detectorsCategories: NuGet
          correlator: desktop-nuget
