name: Localisation check

# Cross-checks this repository's *Strings.cs classes against the .resx files in the resources
# repository and publishes the findings to Security -> Code scanning.

on:
  pull_request:
  push:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  localisation:
    # A version bumped in the csproj before the matching tag exists stops the run with the tag it
    # looked for and the tags that do exist listed, rather than a bare checkout failure.
    uses: g0v0-team/g0v0-l10n-checker/.github/workflows/localisation-check.yml@main
    permissions:
      contents: read
      security-events: write
