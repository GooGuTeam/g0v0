name: Release

on:
  push:
    tags:
      - 'v*-g0v0'
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'

jobs:
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      semver: ${{ steps.version.outputs.semver }}
      nugetVersion: ${{ steps.version.outputs.nugetVersion }}
      velopackVersion: ${{ steps.version.outputs.velopackVersion }}
      assemblyVersion: ${{ steps.version.outputs.assemblyVersion }}
      fileVersion: ${{ steps.version.outputs.fileVersion }}
      androidVersionCode: ${{ steps.version.outputs.androidVersionCode }}
    steps:
      - name: Determine version
        id: version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          SEMVER=${VERSION#v}
          NUMERIC=${SEMVER%%-*}
          PARTS=$(echo "$NUMERIC" | awk -F. '{print NF}')
          if [[ $PARTS -eq 1 ]]; then NUMERIC="$NUMERIC.0.0.0"; fi
          if [[ $PARTS -eq 2 ]]; then NUMERIC="$NUMERIC.0.0"; fi
          if [[ $PARTS -eq 3 ]]; then NUMERIC="$NUMERIC.0"; fi

          VERSION_NUMBERS=$(echo "$SEMVER" | sed 's/-.*$//' | tr -d '.')
          ANDROID_VERSION_CODE="$VERSION_NUMBERS"

          # nugetVersion uses 3-part version from the tag date (e.g. v2026.321.1-g0v0 -> 2026.321.1)
          NUGET_VERSION=$(echo "${SEMVER%%-*}" | awk -F. '{print $1"."$2"."$3}')
          # Velopack requires 3-part semver without pre-release
          VELOPACK_VERSION=$(echo "$NUMERIC" | awk -F. '{print $1"."$2"."$3}')

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "semver=$SEMVER" >> $GITHUB_OUTPUT
          echo "nugetVersion=$NUGET_VERSION" >> $GITHUB_OUTPUT
          echo "velopackVersion=$VELOPACK_VERSION" >> $GITHUB_OUTPUT
          echo "assemblyVersion=$NUMERIC" >> $GITHUB_OUTPUT
          echo "fileVersion=$NUMERIC" >> $GITHUB_OUTPUT
          echo "androidVersionCode=$ANDROID_VERSION_CODE" >> $GITHUB_OUTPUT
          echo "Computed version: $VERSION (semver: $SEMVER, nuget: $NUGET_VERSION, velopack: $VELOPACK_VERSION, assembly/file: $NUMERIC, android: $ANDROID_VERSION_CODE)"

  nuget:
    name: Pack & Publish NuGet
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate Sentry DSN
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -z "$SENTRY_DSN" ]]; then
            echo "ERROR: SENTRY_DSN secret is required for release builds."
            exit 1
          fi

      - name: Pack
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          dotnet pack -c Release osu.Game \
            /p:SentryDsn="$SENTRY_DSN" \
            /p:Version=${{ needs.version.outputs.nugetVersion }} \
            /p:GenerateDocumentationFile=true \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            -o artifacts

          dotnet pack -c Release osu.Game.Rulesets.Osu \
            /p:SentryDsn="$SENTRY_DSN" \
            /p:Version=${{ needs.version.outputs.nugetVersion }} \
            /p:GenerateDocumentationFile=true \
            /p:IncludeSymbols=true \
            /p:SymbolPackageFormat=snupkg \
            -o artifacts

      - name: Upload NuGet artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Publish to GitHub Packages
        run: dotnet nuget push "artifacts/*.nupkg" --api-key ${{ secrets.GITHUB_TOKEN }} --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json --skip-duplicate

  build-windows:
    name: Build ${{ matrix.artifact-name }}
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    concurrency:
      group: build-windows-${{ matrix.runtime }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            artifact-name: g0v0-windows
          - runtime: win-arm64
            artifact-name: g0v0-windows-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate Sentry DSN
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -z "$SENTRY_DSN" ]]; then
            echo "ERROR: SENTRY_DSN secret is required for release builds."
            exit 1
          fi

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
            ~/.cache/NuGet/v3-cache
          key: Windows-${{ matrix.runtime }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            Windows-${{ matrix.runtime }}-nuget-${{ hashFiles('**/*.csproj') }}
            Windows-${{ matrix.runtime }}-nuget-
            Windows-nuget-

      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install -g vpk

      - name: Clean previous build artifacts
        shell: bash
        run: |
          rm -rf osu.Desktop/bin osu.Desktop/obj
          rm -rf publish/${{ matrix.runtime }}

      - name: Restore dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          dotnet restore osu.Desktop/osu.Desktop.csproj \
            --runtime ${{ matrix.runtime }} \
            --verbosity normal \
            --no-cache \
            --force

      - name: Build and publish
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
          SEMVER: ${{ needs.version.outputs.semver }}
          FILE_VERSION: ${{ needs.version.outputs.fileVersion }}
          ASSEMBLY_VERSION: ${{ needs.version.outputs.assemblyVersion }}
          INFO_VERSION: ${{ needs.version.outputs.version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./.github/actions/windows-build.sh

      - name: Create Velopack package
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
          VELOPACK_VERSION: ${{ needs.version.outputs.velopackVersion }}
          EXECUTABLE: g0v0!.exe
        run: ./.github/actions/windows-velopack.sh

      - name: Normalize asset names
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: ./.github/actions/windows-normalize.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ needs.version.outputs.version }}
          path: |
            publish/${{ matrix.runtime }}/
            Releases/
          retention-days: 30

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.artifact-name }}
          path: Releases/
          retention-days: 90

  build-linux:
    name: Build ${{ matrix.artifact-name }}
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: build-linux-${{ matrix.runtime }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: linux-x64
            artifact-name: g0v0-linux
          - runtime: linux-arm64
            artifact-name: g0v0-linux-arm64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate Sentry DSN
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -z "$SENTRY_DSN" ]]; then
            echo "ERROR: SENTRY_DSN secret is required for release builds."
            exit 1
          fi

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
            ~/.cache/NuGet/v3-cache
          key: Linux-${{ matrix.runtime }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            Linux-${{ matrix.runtime }}-nuget-${{ hashFiles('**/*.csproj') }}
            Linux-${{ matrix.runtime }}-nuget-
            Linux-nuget-

      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install -g vpk

      - name: Clean previous build artifacts
        shell: bash
        run: |
          rm -rf osu.Desktop/bin osu.Desktop/obj
          rm -rf publish/${{ matrix.runtime }}

      - name: Restore dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          dotnet restore osu.Desktop/osu.Desktop.csproj \
            --runtime ${{ matrix.runtime }} \
            --verbosity normal \
            --no-cache \
            --force

      - name: Build and publish
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
          SEMVER: ${{ needs.version.outputs.semver }}
          FILE_VERSION: ${{ needs.version.outputs.fileVersion }}
          ASSEMBLY_VERSION: ${{ needs.version.outputs.assemblyVersion }}
          INFO_VERSION: ${{ needs.version.outputs.version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./.github/actions/linux-build.sh

      - name: Create Velopack package
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
          VELOPACK_VERSION: ${{ needs.version.outputs.velopackVersion }}
          EXECUTABLE: g0v0!
        run: ./.github/actions/linux-velopack.sh

      - name: Normalize asset names
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: ./.github/actions/linux-normalize.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ needs.version.outputs.version }}
          path: |
            publish/${{ matrix.runtime }}/
            Releases/
          retention-days: 30

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.artifact-name }}
          path: Releases/
          retention-days: 90

  build-macos:
    name: Build ${{ matrix.artifact-name }}
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: build-macos-${{ matrix.runtime }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-x64
            artifact-name: g0v0-macos-intel
          - runtime: osx-arm64
            artifact-name: g0v0-macos-apple-silicon
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Validate Sentry DSN
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -z "$SENTRY_DSN" ]]; then
            echo "ERROR: SENTRY_DSN secret is required for release builds."
            exit 1
          fi

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
            ~/.cache/NuGet/v3-cache
          key: macOS-${{ matrix.runtime }}-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            macOS-${{ matrix.runtime }}-nuget-${{ hashFiles('**/*.csproj') }}
            macOS-${{ matrix.runtime }}-nuget-
            macOS-nuget-

      - name: Install Velopack CLI
        shell: bash
        run: dotnet tool install -g vpk

      - name: Create macOS icon
        continue-on-error: true
        shell: bash
        run: ./.github/actions/macos-icon.sh

      - name: Clean previous build artifacts
        shell: bash
        run: |
          rm -rf osu.Desktop/bin osu.Desktop/obj
          rm -rf publish/${{ matrix.runtime }}

      - name: Restore dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          dotnet restore osu.Desktop/osu.Desktop.csproj \
            --runtime ${{ matrix.runtime }} \
            --verbosity normal \
            --no-cache \
            --force

      - name: Build and publish
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
          SEMVER: ${{ needs.version.outputs.semver }}
          FILE_VERSION: ${{ needs.version.outputs.fileVersion }}
          ASSEMBLY_VERSION: ${{ needs.version.outputs.assemblyVersion }}
          INFO_VERSION: ${{ needs.version.outputs.version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./.github/actions/macos-build.sh

      - name: Create Velopack package
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
          VELOPACK_VERSION: ${{ needs.version.outputs.velopackVersion }}
          EXECUTABLE: g0v0!
        run: ./.github/actions/macos-velopack.sh

      - name: Normalize asset names
        shell: bash
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: ./.github/actions/macos-normalize.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}-${{ needs.version.outputs.version }}
          path: |
            publish/${{ matrix.runtime }}/
            Releases/
          retention-days: 30

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-${{ matrix.artifact-name }}
          path: Releases/
          retention-days: 90

  build-android:
    name: Build g0v0-android
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: build-android
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 8512546

      - name: Validate Sentry DSN
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -z "$SENTRY_DSN" ]]; then
            echo "ERROR: SENTRY_DSN secret is required for release builds."
            exit 1
          fi

      - name: Accept Android SDK licenses
        shell: bash
        run: yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android workload
        shell: bash
        run: |
          dotnet workload install android
          dotnet workload list
          echo "Android SDK Root: $ANDROID_SDK_ROOT"
          echo "Java Home: $JAVA_HOME"
          # Ensure required Android platform is installed
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
            ~/.local/share/NuGet/v3-cache
            ~/.cache/NuGet/v3-cache
          key: Linux-android-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            Linux-android-nuget-${{ hashFiles('**/*.csproj') }}
            Linux-android-nuget-
            Linux-nuget-

      - name: Clean previous build artifacts
        shell: bash
        run: |
          rm -rf osu.Android/bin osu.Android/obj
          rm -rf publish/android

      - name: Restore dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          dotnet restore osu.Android/osu.Android.csproj \
            --verbosity normal \
            --no-cache \
            --force

      - name: Setup Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./.github/actions/android-signing.sh

      - name: Build and publish APK
        shell: bash
        env:
          SEMVER: ${{ needs.version.outputs.semver }}
          ANDROID_VERSION_CODE: ${{ needs.version.outputs.androidVersionCode }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./.github/actions/android-build.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: g0v0-android-${{ needs.version.outputs.version }}
          path: Releases/
          retention-days: 30

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-g0v0-android
          path: Releases/
          retention-days: 90

  build-ios:
    name: Build g0v0-ios
    needs: version
    runs-on: macos-26
    timeout-minutes: 60
    concurrency:
      group: build-ios
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      - name: Use Xcode 26.6
        run: sudo xcode-select -switch /Applications/Xcode_26.6.app

      - name: Validate Sentry DSN
        shell: bash
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: |
          if [[ -z "$SENTRY_DSN" ]]; then
            echo "ERROR: SENTRY_DSN secret is required for release builds."
            exit 1
          fi

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: |
            ~/.nuget/packages
          key: macOS-ios-nuget-${{ hashFiles('**/*.csproj', '**/packages.lock.json') }}
          restore-keys: |
            macOS-ios-nuget-${{ hashFiles('**/*.csproj') }}
            macOS-ios-nuget-
            macOS-nuget-

      - name: Clean previous build artifacts
        shell: bash
        run: rm -rf osu.iOS/bin osu.iOS/obj

      - name: Restore dependencies
        timeout-minutes: 15
        shell: bash
        run: |
          dotnet restore osu.iOS/osu.iOS.csproj \
            --runtime ios-arm64 \
            --verbosity normal \
            --no-cache \
            --force

      - name: Build and collect IPA
        shell: bash
        env:
          SEMVER: ${{ needs.version.outputs.semver }}
          FILE_VERSION: ${{ needs.version.outputs.fileVersion }}
          ASSEMBLY_VERSION: ${{ needs.version.outputs.assemblyVersion }}
          INFO_VERSION: ${{ needs.version.outputs.version }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
        run: ./.github/actions/ios-build.sh

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: installer-g0v0-ios
          path: Releases/*.ipa
          retention-days: 90

  release:
    name: Create GitHub Release
    needs: [version, nuget, build-windows, build-linux, build-macos, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'installer-*'
          merge-multiple: true
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release-files
          shopt -s globstar nullglob
          for f in artifacts/**/*; do
            if [ -f "$f" ]; then
              cp -f "$f" release-files/
            fi
          done
          echo "Collected files:" && ls -al release-files || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: g0v0! ${{ needs.version.outputs.version }}
          files: release-files/**
          draft: false
          prerelease: ${{ contains(needs.version.outputs.version, 'alpha') || contains(needs.version.outputs.version, 'beta') || contains(needs.version.outputs.version, 'rc') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
